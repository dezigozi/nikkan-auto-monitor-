name: 日刊自動車新聞 毎日取得

permissions:
  contents: write

on:
  schedule:
    # 毎朝7:00 JST 目標。GitHub Actions のスケジュールは混雑時に50〜90分遅延するため、
    # cron は 21:00 UTC（= JST 06:00）に前倒しして、遅延込みで 7:00 JST 前後の着地を狙う。
    - cron: '0 21 * * 0-4'
  workflow_dispatch:   # 手動実行ボタンも有効化

jobs:
  scrape-and-summarize:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: config.json を生成（テンプレートから）
        run: cp config.json.example config.json

      - name: スクレイピング・要約・Slack投稿
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NETDENJD_USERNAME: ${{ secrets.NETDENJD_USERNAME }}
          NETDENJD_PASSWORD: ${{ secrets.NETDENJD_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scraper.py

      - name: articles.json をコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "📰 $(date +'%Y-%m-%d') 記事更新"
          # リモートが先行していても確実に反映（non-fast-forward 対策・最大3回リトライ）。
          # until の条件内 push は set -e で落ちないので、失敗→rebase→再試行が安全に回る。
          n=0
          until git push origin main; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "::error::push に3回失敗しました"; exit 1; fi
            echo "[retry $n] push 拒否 → リベースして再試行..."
            git pull --rebase --autostash origin main
            sleep 3
          done
